  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0e"/>
      <stop offset="0.6" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0a1413"/>
